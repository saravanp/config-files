[general]
live_config_reload = true

[terminal.shell]
program = "/usr/bin/tmux"
args = ["new-session", "-A", "-s", "default"]

[font]
size = 10.5

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrains Mono"
style = "Bold Italic"

[window.padding]
x = 10
y = 10
