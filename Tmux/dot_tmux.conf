set -g mouse on

setw -g mode-keys vi

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Other examples:
# set -g @plugin 'github_username/plugin_name'

# ==============================================================================
# MINIMALIST TMUX STATUS BAR (LONG SESSION NAME)
# ==============================================================================

# General settings
set -g status-interval 5
set -g status-justify left

# Expanded limit to prevent truncation of long session names
set -g status-left-length 100

# Colors
set -g status-style bg=colour234,fg=colour250
set -g window-status-style bg=colour234,fg=colour244
set -g window-status-current-style bg=colour238,fg=colour75,bold
set -g window-status-separator "#[fg=colour237]│"

# 1. LEFT SIDE: Long session name with padding
set -g status-left "#[fg=colour40,bold] #S #[fg=colour239]│ "

# 2. CENTER: Window list formatting
set -g window-status-format " #I:#W#F "
set -g window-status-current-format " #I:#W#F "

# 3. RIGHT SIDE: Disabled
set -g status-right ""

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

